name: Symfony

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # The installed packages against the security advisories ————————————————————
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - uses: actions/checkout@v4
      - name: Install the dependencies
        run: composer install --no-interaction --no-progress --no-scripts --prefer-dist
      - name: Audit the dependencies
        run: composer audit

  # The tests and their coverage threshold, on PHP 8.5 and the next PHP ————————
  tests:
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.5', '8.6']
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: xdebug
          tools: castor
      - uses: actions/checkout@v4
      - name: Cache the Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-php${{ matrix.php-versions }}-composer-${{ hashFiles('composer.lock') }}
      - name: Install the dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare the database
        run: castor load-fixtures
      - name: Run the tests with their coverage threshold
        run: castor coverage

  # Every lint and the static analysis —————————————————————————————————————————
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: castor
      - uses: actions/checkout@v4
      - name: Cache the Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
      - name: Install the dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run every lint and the static analysis
        run: castor lint
