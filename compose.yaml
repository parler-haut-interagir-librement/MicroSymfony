# The application served by FrankenPHP in worker mode: run `castor up`, then open https://localhost.
# The Symfony binary stays the lighter choice: `castor start`.
services:
  php:
    build:
      context: ./docker
    environment:
      SERVER_NAME: "${SERVER_NAME:-localhost}"
      # Worker mode: the kernel boots once per worker and serves request after request. `watch` restarts the
      # workers when a PHP file, a template or the configuration changes.
      FRANKENPHP_CONFIG: |
        worker {
          file ./public/index.php
          watch
        }
      APP_ENV: "${APP_ENV:-dev}"
    volumes:
      - ./:/app
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
      - "127.0.0.1:${HTTPS_PORT:-443}:443"
      - "127.0.0.1:${HTTPS_PORT:-443}:443/udp"
    tty: true

volumes:
  caddy_data:
  caddy_config:
